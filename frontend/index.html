
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f9" />
    <meta name="description" content="Atlas agent resources portal" />
    <title>Atlas | Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                50: '#f6f8fb', 100: '#eaf0f6', 200: '#d9e2ec',
                300: '#bdcbd9', 400: '#8295a9', 500: '#5c7085',
                600: '#455b72', 700: '#30465d', 800: '#23384d',
                900: '#1c2c3d', 950: '#142231'
              },
              indigo: {
                50: '#edf9fb', 100: '#d9f1f4', 200: '#afe1e8',
                300: '#79ccd7', 400: '#42b2c3', 500: '#2097ab',
                600: '#117e91', 700: '#106677', 800: '#125464',
                900: '#144654', 950: '#092d37'
              }
            },
            borderRadius: { lg: '0.875rem', xl: '1.125rem', '2xl': '1.75rem', '3xl': '2.125rem' },
            boxShadow: {
              sm: '0 4px 20px rgb(18 29 45 / 0.045)',
              md: '0 12px 36px rgb(18 29 45 / 0.09)',
              lg: '0 18px 48px rgb(18 29 45 / 0.11)',
              xl: '0 16px 40px rgb(35 55 80 / 0.10)',
              '2xl': '0 24px 56px rgb(35 55 80 / 0.12)'
            }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'DM Sans', sans-serif;
        background-color: #f5f7f9;
        color: #23384d;
      }
      h1, h2, h3, h4, h5, h6, button, nav {
        font-family: 'Manrope', sans-serif;
      }
      html { color-scheme: light; touch-action: auto; }
      html { scroll-padding-top: 11rem; }
      body { -webkit-font-smoothing: antialiased; }
      button:not(:disabled), summary { cursor: pointer; }
      button:disabled { cursor: not-allowed; }
      .skip-link { position: fixed; top: 1rem; left: 1rem; z-index: 100; transform: translateY(-200%); border-radius: 1rem; padding: 0.75rem 1rem; background: #fff; color: #144654; box-shadow: 0 4px 20px rgb(18 29 45 / 0.16); }
      .skip-link:focus { transform: translateY(0); }
      #main-content:focus { outline: none; }
      .category-section > div { max-width: none; margin: 0; padding: 0; }
      .portal-background {
        background-image: radial-gradient(ellipse 70% 32rem at 0% 5rem, rgb(17 126 145 / 0.075), transparent 75%), radial-gradient(ellipse 60% 28rem at 100% 8rem, rgb(35 56 77 / 0.035), transparent 75%), linear-gradient(180deg, #f0f4f7 0%, #f7f8fa 38rem, #f5f7f9 100%);
        background-repeat: no-repeat;
      }
      .dark .portal-background {
        background-image: radial-gradient(ellipse 70% 32rem at 0% 5rem, rgb(17 126 145 / 0.10), transparent 75%), radial-gradient(ellipse 60% 28rem at 100% 8rem, rgb(35 56 77 / 0.06), transparent 75%), linear-gradient(180deg, #142231 0%, #162332 38rem, #142231 100%);
      }
      .portal-interactive { position: relative; }
      a:focus-visible, button:focus-visible { outline: 2px solid #117e91; outline-offset: 3px; }
      @media (prefers-reduced-motion: no-preference) {
        button, a.rounded-full { transition: background-color 180ms ease, box-shadow 180ms ease, transform 180ms ease; }
        button:active, a.rounded-full:active { transform: scale(0.98); }
      }
      .portal-interactive:focus-within { box-shadow: 0 0 0 2px rgb(17 126 145 / 0.3), 0 12px 36px rgb(18 29 45 / 0.08); }
      @media (prefers-reduced-motion: no-preference) {
        .portal-interactive { transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease; }
        .portal-interactive:active { transform: scale(0.985); }
        @media (hover: hover) and (pointer: fine) {
          .portal-interactive:hover { transform: translateY(-2px) scale(1.01); }
        }
      }
      html.dark { color-scheme: dark; }
      .dark body { background-color: #142231; color: #d9e2ec; }
      ::selection { background: #dce7f3; color: #2c4663; }
      .dark ::selection { background: #345376; color: #eef3f9; }
      .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #bdcbd9 transparent; }
      .dark .custom-scrollbar { scrollbar-color: #455b72 transparent; }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #bdcbd9;
        border-radius: 10px;
      }
      .custom-scrollbar:hover::-webkit-scrollbar-thumb {
        background: #8295a9;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
