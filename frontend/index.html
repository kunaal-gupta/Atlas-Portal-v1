
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F5F9" />
    <meta name="description" content="Atlas agent resources portal" />
    <title>Atlas | Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                50: '#f6f8fb', 100: '#eaf0f6', 200: '#e2e8f0',
                300: '#bdcbd9', 400: '#8295a9', 500: '#5c7085',
                600: '#455b72', 700: '#30465d', 800: '#23384d',
                900: '#101827', 950: '#101827'
              },
              amber: {
                50: '#fbf7f0', 100: '#f5ead8', 200: '#ead3ad',
                300: '#dfbb86', 400: '#D5A45D', 500: '#bd8942',
                600: '#a16e2f', 700: '#805625', 800: '#664521',
                900: '#533a20', 950: '#2d1e11'
              },
              indigo: {
                50: '#E8F5F6', 100: '#d9f1f4', 200: '#afe1e8',
                300: '#79ccd7', 400: '#42b2c3', 500: '#2097ab',
                600: '#087F91', 700: '#106677', 800: '#125464',
                900: '#144654', 950: '#092d37'
              }
            },
            borderRadius: { lg: '0.5rem', xl: '1rem', '2xl': '1.5rem', '3xl': '2rem' },
            boxShadow: {
              sm: '0 10px 32px rgb(18 29 45 / 0.055)',
              md: '0 18px 48px rgb(18 29 45 / 0.10)',
              lg: '0 18px 48px rgb(18 29 45 / 0.11)',
              xl: '0 16px 40px rgb(35 55 80 / 0.10)',
              '2xl': '0 24px 56px rgb(35 55 80 / 0.12)'
            }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'DM Sans', sans-serif;
        background-color: #F3F5F9;
        color: #23384d;
      }
      h1, h2, h3, h4, h5, h6, button, nav {
        font-family: 'Manrope', sans-serif;
      }
      h1, h2, h3, h4 { color: #101827; }
      .dark h1, .dark h2, .dark h3, .dark h4 { color: #e2e8f0; }
      html { color-scheme: light; touch-action: auto; }
      html { scroll-padding-top: calc(var(--portal-navigation-bottom, 129px) + var(--portal-section-navigation-height, 0px) + 16px); }
      body { -webkit-font-smoothing: antialiased; font-size: 15px; line-height: 1.6; }
      .text-xs, [class*="text-[9px]"], [class*="text-[10px]"], [class*="text-[11px]"] { font-size: 12px; line-height: 1.5; }
      .uppercase { letter-spacing: 0.06em; }
      input, select, textarea { border-radius: 8px; }
      button:not(:disabled), summary { cursor: pointer; }
      button:disabled { cursor: not-allowed; }
      .skip-link { position: fixed; top: 1rem; left: 1rem; z-index: 100; transform: translateY(-200%); border-radius: 1rem; padding: 0.75rem 1rem; background: #fff; color: #144654; box-shadow: 0 4px 20px rgb(18 29 45 / 0.16); }
      .skip-link:focus { transform: translateY(0); }
      #main-content:focus { outline: none; }
      .category-section > div { max-width: none; margin: 0; padding: 0; }
      .portal-background { background-color: #F3F5F9; background-image: none; }
      .dark .portal-background { background-color: #142231; background-image: none; }
      .welcome-surface { background: linear-gradient(105deg, #E8F5F6 0%, #f4fafb 48%, #ffffff 100%); border: 1px solid transparent; border-radius: 24px; }
      .dark .welcome-surface { background: linear-gradient(105deg, #14363b 0%, #1c2c3d 80%); border-color: #30465d; }
      .portal-interactive { position: relative; }
      a:focus-visible, button:focus-visible { outline: 2px solid #087F91; outline-offset: 3px; }
      @media (prefers-reduced-motion: no-preference) {
        button, a.rounded-full { transition: background-color 180ms ease, box-shadow 180ms ease, transform 180ms ease; }
        button:active, a.rounded-full:active { transform: scale(0.98); }
      }
      .portal-interactive:focus-within { box-shadow: 0 0 0 2px rgb(17 126 145 / 0.3), 0 12px 36px rgb(18 29 45 / 0.08); }
      @media (prefers-reduced-motion: no-preference) {
        .portal-interactive { transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease; }
        .portal-interactive:active { transform: scale(0.985); }
        @media (hover: hover) and (pointer: fine) {
          .portal-interactive:hover { transform: translateY(-2px) scale(1.01); }
        }
      }
      html.dark { color-scheme: dark; }
      .dark body { background-color: #142231; color: #d9e2ec; }
      ::selection { background: #dce7f3; color: #2c4663; }
      .dark ::selection { background: #345376; color: #eef3f9; }
      .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #bdcbd9 transparent; }
      .dark .custom-scrollbar { scrollbar-color: #455b72 transparent; }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #bdcbd9;
        border-radius: 10px;
      }
      .custom-scrollbar:hover::-webkit-scrollbar-thumb {
        background: #8295a9;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
