
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf2f7" />
    <meta name="description" content="Atlas agent resources portal" />
    <title>Atlas | Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                50: '#f6f8fb', 100: '#eaf0f6', 200: '#d9e2ec',
                300: '#bdcbd9', 400: '#8295a9', 500: '#5c7085',
                600: '#455b72', 700: '#30465d', 800: '#23384d',
                900: '#1c2c3d', 950: '#142231'
              },
              teal: {
                50: '#f0f7f5', 100: '#deede7', 200: '#bddbd1',
                300: '#99c4b5', 400: '#73aa98', 500: '#518c7a',
                600: '#3e7464', 700: '#315d51', 800: '#294c43',
                900: '#243f38', 950: '#142923'
              },
              indigo: {
                50: '#eef3f9', 100: '#dce7f3', 200: '#c0d2e7',
                300: '#9ab7d6', 400: '#7597bf', 500: '#557daa',
                600: '#40658f', 700: '#345376', 800: '#2c4663',
                900: '#273c53', 950: '#19283a'
              }
            },
            boxShadow: {
              sm: '0 1px 3px rgb(35 55 80 / 0.04)',
              md: '0 5px 16px rgb(35 55 80 / 0.07)',
              lg: '0 10px 28px rgb(35 55 80 / 0.09)',
              xl: '0 16px 40px rgb(35 55 80 / 0.10)',
              '2xl': '0 24px 56px rgb(35 55 80 / 0.12)'
            }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'DM Sans', sans-serif;
        background-color: #edf2f7;
        color: #23384d;
      }
      h1, h2, h3, h4, h5, h6, button, nav {
        font-family: 'Manrope', sans-serif;
      }
      html { color-scheme: light; }
      html.dark { color-scheme: dark; }
      .dark body { background-color: #142231; color: #d9e2ec; }
      ::selection { background: #dce7f3; color: #2c4663; }
      .dark ::selection { background: #345376; color: #eef3f9; }
      .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #bdcbd9 transparent; }
      .dark .custom-scrollbar { scrollbar-color: #455b72 transparent; }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #bdcbd9;
        border-radius: 10px;
      }
      .custom-scrollbar:hover::-webkit-scrollbar-thumb {
        background: #8295a9;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
