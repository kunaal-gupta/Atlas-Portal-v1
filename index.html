    <title>Atlas | Agent Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'DM Sans', sans-serif;
        background-color: #f1f5f9; /* Slightly darker slate for better contrast with white components */
        color: #0f172a;
      }
      h1, h2, h3, h4, h5, h6, button, nav {
        font-family: 'Manrope', sans-serif;
      }
      ::selection { background: #c7d2fe; color: #312e81; }
      .app-grid {
        background-image: radial-gradient(circle at 1px 1px, rgb(148 163 184 / 0.13) 1px, transparent 0);
        background-size: 24px 24px;
      }
      .dark .app-grid {
        background-image: radial-gradient(circle at 1px 1px, rgb(100 116 139 / 0.12) 1px, transparent 0);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      .custom-scrollbar:hover::-webkit-scrollbar-thumb {
        background: #cbd5e1;
      }
    </style>
